# Coturn configuration with STUN and TURN enabled (see "Enabling TURN" in the
# README).
#
# TURN authentication uses time-limited HMAC credentials (use-auth-secret):
# the hub mints username/password pairs derived from a secret shared with
# coturn, which coturn can verify.
#
# The secret (and logging) is configured in the compose files. The image's
# command-line flags override anything set here.

listening-port=3478
# Listen on IPv4 AND IPv6: the client library prefers v6 and a v4-only
# relay adds tens of seconds of connection-setup latency for v6-capable
# clients.
listening-ip=0.0.0.0
listening-ip=::

# The realm is an arbitrary label here.
realm=wispers

# Relay allocations use this UDP port range. Open them in the firewall. The
# range must match the port mapping in docker-compose.turn.yml. 256 ports is
# sufficient for 128 bidirectional relays, plenty for a self-hosted
# deployment.
min-port=49152
max-port=49407

# SECURITY: This denylist prevents nodes from reaching your private network and
# localhost through the relay. Extend it to fit your setup as needed.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
